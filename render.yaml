services:
  - type: web
    name: project-overthink
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
