
services:
  - type: web
    name: project-overthink
    env: node
    plan: free
    buildCommand: pip install -r python/requirements.txt && npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
